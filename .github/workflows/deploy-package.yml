name: Deploy Creatio package

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID from the successful Build Creatio package URL"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: creatio-lab-runtime-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, creatio-lab]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Validate source build
        id: source
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          run_id = os.environ["BUILD_RUN_ID"].strip()
          if not re.fullmatch(r"[0-9]+", run_id):
              raise SystemExit("STOP: build_run_id must contain only digits")

          repository = os.environ["GITHUB_REPOSITORY"]
          url = (
              f"https://api.github.com/repos/{repository}"
              f"/actions/runs/{run_id}"
          )
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)

          checks = [
              run.get("status") == "completed",
              run.get("conclusion") == "success",
              run.get("head_branch") == "main",
              run.get("event") == "workflow_dispatch",
              run.get("path", "").split("@", 1)[0]
                  == ".github/workflows/build-package.yml",
              (run.get("head_repository") or {}).get("full_name")
                  == repository,
          ]
          if not all(checks):
              raise SystemExit(
                  "STOP: expected a successful package build from this repository's main branch"
              )

          number = int(run["run_number"])
          artifact = f"order-calculator-{number}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"artifact_name={artifact}\n")
              output.write(f"run_id={run_id}\n")

          print(f"Verified build run: {run_id}")
          print(f"Source commit: {run['head_sha']}")
          print(f"Artifact: {artifact}")
          PY

      - name: Download built artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming-artifact

      - name: Verify package
        run: |
          set -euo pipefail
          python3 scripts/deploy-creatio-package.py incoming-artifact

      - name: Check Design readiness
        run: |
          set -euo pipefail
          kubectl --context=creatio-lab -n creatio-control-plane \
            rollout status statefulset/creatio-runtime-design \
            --timeout=180s

      - name: Install package on Design
        env:
          CREATIO_RUNTIME_USERNAME: ${{ secrets.CREATIO_RUNTIME_USERNAME }}
          CREATIO_RUNTIME_PASSWORD: ${{ secrets.CREATIO_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/deploy-creatio-package.py \
            incoming-artifact --install

      - name: Wait for Design readiness after installation
        run: |
          set -euo pipefail
          kubectl --context=creatio-lab -n creatio-control-plane \
            rollout status statefulset/creatio-runtime-design \
            --timeout=600s
